<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Heavenly Tacos Menu Card</h1>

    <form id="menu-form">
        <label for="menu-input">Paste your menu as JSON</label>
        <textarea id="menu-input" rows="8">[
  {"name": "Street Carne Asada Taco", "price": 4.5},
  {"name": "Smoked Chicken Burrito", "price": 9.5},
  {"name": "Queso Loaded Nachos", "price": 7.25},
  {"name": "Cajun Spiced Churros", "price": 3.5}
]</textarea>
        <button type="submit">Show my menu</button>
    </form>

    <p id="count"></p>
    <p id="menu-text"></p>

    <script src="script.js"></script>
</body>
</html>>
